<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mass Spectrum Generator</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --page: #eef4fb;
      --panel: #ffffff;
      --ink: #1d2530;
      --muted: #66717f;
      --line: #dde4ee;
      --accent: #245fc6;
      --accent-soft: #eaf1ff;
      --danger: #b84545;
      --shadow: 0 18px 45px rgba(28, 49, 82, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 30px clamp(18px, 4vw, 54px) 26px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      color: #213f93;
      font-size: clamp(30px, 3vw, 42px);
      margin: 0 0 12px;
      line-height: 1.05;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 20px;
    }

    .language {
      display: flex;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
      background: #f8fafd;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 0 16px;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    button:hover {
      border-color: #aab8ca;
      transform: translateY(-1px);
    }

    button.primary,
    .language button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.secondary {
      background: var(--accent-soft);
      border-color: #bdd0f6;
      color: #164397;
    }

    button.danger {
      color: var(--danger);
    }

    main {
      padding: 34px clamp(18px, 4vw, 54px);
      display: grid;
      grid-template-columns: minmax(360px, 570px) minmax(540px, 1fr);
      gap: 38px;
      align-items: start;
    }

    .controls,
    .plot-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .tab {
      border: 0;
      border-radius: 0;
      min-height: 64px;
      font-weight: 700;
      color: var(--muted);
      background: #ffffff;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: #fbfdff;
    }

    .panel {
      display: none;
      padding: 26px 28px;
    }

    .panel.active {
      display: block;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label,
    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    textarea,
    input[type="text"],
    input[type="number"],
    input[type="color"],
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fbfcfe;
      min-height: 44px;
      padding: 10px 12px;
      outline: none;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: #8aa7df;
      box-shadow: 0 0 0 3px rgba(36, 95, 198, 0.12);
    }

    textarea {
      min-height: 360px;
      resize: vertical;
      line-height: 1.55;
      font-family: "Courier New", monospace;
      font-size: 18px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .toggle {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 18px;
      background: #fbfcfe;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 24px;
      height: 24px;
      accent-color: var(--accent);
    }

    .spectrum-block {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 28px 26px;
    }

    .file-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .plot-wrap {
      min-height: 680px;
      padding: 20px;
    }

    #plot {
      width: 100%;
      height: 640px;
    }

    #plot .annotation-arrow-g path:nth-child(2) {
      display: none;
    }

    #plot .xlines-above,
    #plot .ylines-above,
    #plot .plot-box-overlay {
      pointer-events: none;
    }

    .status {
      border-top: 1px solid var(--line);
      padding: 14px 28px 22px;
      color: var(--muted);
      min-height: 52px;
    }

    footer {
      color: var(--muted);
      padding: 0 clamp(18px, 4vw, 54px) 28px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1050px) {
      main {
        grid-template-columns: 1fr;
      }

      .plot-wrap {
        min-height: 520px;
      }

      #plot {
        height: 500px;
      }
    }

    @media (max-width: 640px) {
      header {
        display: block;
      }

      .language {
        margin-top: 18px;
        width: max-content;
      }

      main {
        padding-top: 18px;
      }

      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .panel,
      .actions,
      .status {
        padding-left: 18px;
        padding-right: 18px;
      }

      textarea {
        min-height: 280px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="title">Mass Spectrum Generator</h1>
      <p data-i18n="subtitle">Enter a list of m/z and intensity values to generate the spectrum</p>
    </div>
    <div class="language" role="group" aria-label="Language">
      <button type="button" id="ptBtn">PT</button>
      <button type="button" id="enBtn" class="active">EN</button>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Controls">
      <nav class="tabs" aria-label="Settings tabs">
        <button type="button" class="tab active" data-tab="data" data-i18n="tabData">Data</button>
        <button type="button" class="tab" data-tab="style" data-i18n="tabStyle">Style</button>
        <button type="button" class="tab" data-tab="axes" data-i18n="tabAxes">Axes &amp; peaks</button>
        <button type="button" class="tab" data-tab="export" data-i18n="tabExport">Export</button>
      </nav>

      <div class="panel active" id="panel-data">
        <label class="toggle">
          <input type="checkbox" id="secondSpectrum">
          <span data-i18n="secondSpectrum">Add a second spectrum below</span>
        </label>

        <div class="field">
          <label for="data1" data-i18n="dataLabel">Data (m/z, intensity)</label>
          <textarea id="data1" spellcheck="false"></textarea>
        </div>

        <div id="spectrum2" class="spectrum-block hidden">
          <label class="toggle">
            <input type="checkbox" id="thirdSpectrum">
            <span data-i18n="thirdSpectrum">Add a third spectrum below</span>
          </label>
          <div class="field">
            <label for="data2" data-i18n="dataLabel2">Data 2 (m/z, intensity)</label>
            <textarea id="data2" spellcheck="false"></textarea>
          </div>
        </div>

        <div id="spectrum3" class="spectrum-block hidden">
          <label class="toggle">
            <input type="checkbox" id="fourthSpectrum">
            <span data-i18n="fourthSpectrum">Add a fourth spectrum below</span>
          </label>
          <div class="field">
            <label for="data3" data-i18n="dataLabel3">Data 3 (m/z, intensity)</label>
            <textarea id="data3" spellcheck="false"></textarea>
          </div>
        </div>

        <div id="spectrum4" class="spectrum-block hidden">
          <div class="field">
            <label for="data4" data-i18n="dataLabel4">Data 4 (m/z, intensity)</label>
            <textarea id="data4" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="file-line">
          <button type="button" id="loadExample" data-i18n="loadExample">Load example</button>
          <button type="button" id="clearData" data-i18n="clear">Clear</button>
          <button type="button" id="chooseFile" data-i18n="loadFile">Load file (.csv/.txt)</button>
          <input type="file" id="fileInput" class="hidden" accept=".csv,.txt,text/csv,text/plain">
        </div>
      </div>

      <div class="panel" id="panel-style">
        <div class="field">
          <label for="chartTitle" data-i18n="chartTitle">Chart title</label>
          <input id="chartTitle" type="text" value="Mass Spectrum">
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="xLabel" data-i18n="xLabel">X label</label>
            <input id="xLabel" type="text" value="<i>m/z</i>">
          </div>
          <div class="field">
            <label for="yLabel" data-i18n="yLabel">Y label</label>
            <input id="yLabel" type="text" value="Relative intensity (%)">
          </div>
          <div class="field">
            <label for="peakColor1" data-i18n="peakColor">Peak color</label>
            <input id="peakColor1" type="color" value="#1f4e8b">
          </div>
          <div class="field">
            <label for="peakColor2" data-i18n="peakColor2">Peak color (2nd)</label>
            <input id="peakColor2" type="color" value="#c94e4e">
          </div>
          <div class="field">
            <label for="peakColor3" data-i18n="peakColor3">Peak color (3rd)</label>
            <input id="peakColor3" type="color" value="#2c8f63">
          </div>
          <div class="field">
            <label for="peakColor4" data-i18n="peakColor4">Peak color (4th)</label>
            <input id="peakColor4" type="color" value="#8a5cc2">
          </div>
          <div class="field">
            <label for="backgroundColor" data-i18n="backgroundColor">Background color</label>
            <input id="backgroundColor" type="color" value="#ffffff">
          </div>
          <div class="field">
            <label for="textColor" data-i18n="textColor">Text color</label>
            <input id="textColor" type="color" value="#1c2430">
          </div>
          <div class="field">
            <label for="gridColor" data-i18n="gridColor">Grid color</label>
            <input id="gridColor" type="color" value="#eceff3">
          </div>
          <div class="field">
            <label for="boxLineWidth" data-i18n="boxLineWidth">Plot box line width (px)</label>
            <input id="boxLineWidth" type="number" min="0.5" max="8" step="0.5" value="1">
          </div>
          <div class="field">
            <label for="gridLineWidth" data-i18n="gridLineWidth">Grid line width (px)</label>
            <input id="gridLineWidth" type="number" min="0.25" max="5" step="0.25" value="1">
          </div>
          <div class="field">
            <label for="fontFamily" data-i18n="font">Font</label>
            <select id="fontFamily">
              <option>Arial</option>
              <option>Helvetica</option>
              <option>Times New Roman</option>
              <option>Georgia</option>
              <option>Courier New</option>
              <option>Trebuchet MS</option>
              <option>Verdana</option>
              <option>Tahoma</option>
              <option>Comic Sans MS</option>
              <option>Lucida Console</option>
            </select>
          </div>
          <div class="field">
            <label for="fontSize" data-i18n="fontSize">Font size (px)</label>
            <input id="fontSize" type="number" min="8" max="40" value="14">
          </div>
          <div class="field">
            <label for="yOffset" data-i18n="yOffset">Y label offset (px)</label>
            <input id="yOffset" type="number" min="0" max="120" value="20">
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="showGrid" checked>
          <span data-i18n="showGrid">Show grid</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="closeBox">
          <span data-i18n="closeBox">Close plot box</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="showDots">
          <span data-i18n="showDots">Show dot at peak tip</span>
        </label>
      </div>

      <div class="panel" id="panel-axes">
        <label class="toggle">
          <input type="checkbox" id="normalize" checked>
          <span data-i18n="normalize">Normalize to base peak (100%)</span>
        </label>
        <div class="field-grid">
          <div class="field">
            <label for="yScale" data-i18n="yScale">Y scale (%)</label>
            <input id="yScale" type="number" min="1" value="120">
          </div>
          <div class="field">
            <label for="yScale1" data-i18n="yScale1">Y scale 1 (%)</label>
            <input id="yScale1" type="number" min="1" value="120">
          </div>
          <div class="field">
            <label for="yScale2" data-i18n="yScale2">Y scale 2 (%)</label>
            <input id="yScale2" type="number" min="1" value="120">
          </div>
          <div class="field">
            <label for="yScale3" data-i18n="yScale3">Y scale 3 (%)</label>
            <input id="yScale3" type="number" min="1" value="120">
          </div>
          <div class="field">
            <label for="yScale4" data-i18n="yScale4">Y scale 4 (%)</label>
            <input id="yScale4" type="number" min="1" value="120">
          </div>
          <div class="field">
            <label for="decimals" data-i18n="decimals">m/z decimal places</label>
            <input id="decimals" type="number" min="0" max="6" value="1">
          </div>
          <div class="field">
            <label for="minMz" data-i18n="minMz">Min m/z (auto if empty)</label>
            <input id="minMz" type="number" step="any">
          </div>
          <div class="field">
            <label for="maxMz" data-i18n="maxMz">Max m/z (auto if empty)</label>
            <input id="maxMz" type="number" step="any">
          </div>
          <div class="field">
            <label for="xTickStep" data-i18n="xTickStep">X tick interval (auto if empty)</label>
            <input id="xTickStep" type="number" min="0" step="any">
          </div>
          <div class="field">
            <label for="threshold" data-i18n="threshold">Label threshold (%)</label>
            <input id="threshold" type="number" min="0" max="100" value="10">
          </div>
          <div class="field">
            <label for="spectrumGap" data-i18n="spectrumGap">Spectra spacing (%)</label>
            <input id="spectrumGap" type="number" min="0" max="30" value="8">
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="lockY" checked>
          <span data-i18n="lockY">Lock Y scales of all spectra</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="labelPeaks" checked>
          <span data-i18n="labelPeaks">Label main peaks</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="clickMz">
          <span data-i18n="clickMz">Show m/z when clicking a peak</span>
        </label>
        <button type="button" id="clearSelection" data-i18n="clearSelection">Clear peak selection</button>
        <button type="button" id="resetDefaults" data-i18n="resetDefaults">Reset defaults</button>
      </div>

      <div class="panel" id="panel-export">
        <div class="field-grid">
          <div class="field">
            <label for="exportWidth" data-i18n="width">Width (px)</label>
            <input id="exportWidth" type="number" min="300" value="1200">
          </div>
          <div class="field">
            <label for="exportHeight" data-i18n="height">Height (px)</label>
            <input id="exportHeight" type="number" min="250" value="700">
          </div>
          <div class="field">
            <label for="exportScale" data-i18n="scale">Scale (DPI)</label>
            <input id="exportScale" type="number" min="1" max="5" value="2">
          </div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="previewExport">
          <span data-i18n="previewExport">Preview at export size</span>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="generate" data-i18n="generate">Generate spectrum</button>
        <button type="button" class="secondary" id="download" data-i18n="download">Download PNG</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="plot-wrap" aria-label="Spectrum plot">
      <div id="plot"></div>
    </section>
  </main>

  <footer data-i18n="footer">Made with Plotly.js · All calculations run in the browser</footer>

        width: "Largura (px)",
        height: "Altura (px)",
        scale: "Escala (DPI)",
        previewExport: "Pré-visualizar no tamanho exportado",
        generate: "Gerar espectro",
        download: "Baixar PNG",
        footer: "Feito com Plotly.js · Todos os cálculos rodam no navegador",
        generated: count => `Espectro gerado com ${count} picos.`,
        empty: "Adicione pelo menos um par válido de m/z e intensidade.",
        parseError: "Algumas linhas não puderam ser lidas e foram ignoradas.",
        fileLoaded: "Arquivo carregado. Gere o espectro para atualizar o gráfico.",
        selectionCleared: "Seleção de pico limpa.",
        selected: mz => `Rótulo manual adicionado: m/z ${mz}`
      }
    };

    const $ = id => document.getElementById(id);
    let language = "en";
    let selectedPeaks = [];
    let labelEdits = {};
    let renderedAnnotationKeys = [];
    let lastPlot = { data: [], layout: {}, config: {} };
    let clickHandlerBound = false;
    let relayoutHandlerBound = false;

    function t(key) {
      return translations[language][key];
    }

    function updateLanguage(nextLanguage) {
      language = nextLanguage;
      document.documentElement.lang = nextLanguage === "pt" ? "pt-BR" : "en";
      $("ptBtn").classList.toggle("active", nextLanguage === "pt");
      $("enBtn").classList.toggle("active", nextLanguage === "en");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        if (typeof translations[language][key] === "string") {
          el.textContent = translations[language][key];
        }
      });
      if ($("resetDefaults") && !translations[language].resetDefaults) {
        $("resetDefaults").textContent = nextLanguage === "pt" ? "Restaurar padroes" : "Reset defaults";
      }
      renderPlot();
    }

    function parseSpectrum(text) {
      const peaks = [];
      let skipped = 0;
      text.split(/\r?\n/).forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith("#")) return;
        const parts = trimmed.split(/[,\t; ]+/).filter(Boolean);
        if (parts.length < 2) {
          skipped += 1;
          return;
        }
        const mz = Number(parts[0].replace(",", "."));
        const intensity = Number(parts[1].replace(",", "."));
        if (Number.isFinite(mz) && Number.isFinite(intensity)) {
          peaks.push({ mz, intensity });
        } else {
          skipped += 1;
        }
      });
      peaks.sort((a, b) => a.mz - b.mz);
      return { peaks, skipped };
    }

    function getSpectra() {
      const entries = [
        { text: $("data1").value, color: $("peakColor1").value, name: "Spectrum 1" }
      ];
      if ($("secondSpectrum").checked) {
        entries.push({ text: $("data2").value, color: $("peakColor2").value, name: "Spectrum 2" });
      }
      if ($("secondSpectrum").checked && $("thirdSpectrum").checked) {
        entries.push({ text: $("data3").value, color: $("peakColor3").value, name: "Spectrum 3" });
      }
      if ($("secondSpectrum").checked && $("thirdSpectrum").checked && $("fourthSpectrum").checked) {
        entries.push({ text: $("data4").value, color: $("peakColor4").value, name: "Spectrum 4" });
      }
      return entries.map(entry => ({ ...entry, ...parseSpectrum(entry.text) })).filter(entry => entry.peaks.length);
    }

    function normalizePeaks(peaks) {
      if (!$("normalize").checked) return peaks.map(p => ({ ...p, y: p.intensity }));
      const max = Math.max(...peaks.map(p => p.intensity), 1);
      return peaks.map(p => ({ ...p, y: (p.intensity / max) * 100 }));
    }

    function axisDomain(index, total, gap) {
      if (total === 1) return [0, 1];
      const height = (1 - gap * (total - 1)) / total;
      const topIndex = total - index - 1;
      const start = topIndex * (height + gap);
      return [start, start + height];
    }

    function getAxisId(prefix, index) {
      return index === 0 ? prefix : `${prefix}${index + 1}`;
    }

    function makePeakTrace(spectrum, index, total, decimals, threshold) {
      const normalized = normalizePeaks(spectrum.peaks);
      const xAxisId = getAxisId("x", index);
      const yAxisId = getAxisId("y", index);
      const x = [];
      const y = [];
      const customdata = [];
      normalized.forEach(peak => {
        x.push(peak.mz, peak.mz, null);
        y.push(0, peak.y, null);
        customdata.push(peak.mz, peak.mz, null);
      });
      const trace = {
        type: "scatter",
        mode: "lines",
        x,
        y,
        customdata,
        name: spectrum.name,
        line: { color: spectrum.color, width: 2 },
        hovertemplate: "m/z %{customdata:.4f}<br>%{y:.2f}%<extra></extra>",
        xaxis: xAxisId,
        yaxis: yAxisId
      };
      const traces = [trace];

      if ($("showDots").checked) {
        const markerPeaks = normalized.filter(peak => peak.y >= 0.5);
        traces.push({
          type: "scatter",
          mode: "markers",
          x: markerPeaks.map(peak => peak.mz),
          y: markerPeaks.map(peak => peak.y),
          customdata: markerPeaks.map(peak => peak.mz),
          marker: { color: spectrum.color, size: 5 },
          hovertemplate: "m/z %{customdata:.4f}<br>%{y:.2f}%<extra></extra>",
          showlegend: false,
          xaxis: xAxisId,
          yaxis: yAxisId
        });
      }

      if ($("labelPeaks").checked && !$("clickMz").checked) {
        const labelX = [];
        const labelY = [];
        const labelText = [];
        normalized.forEach(peak => {
          if (peak.y >= threshold) {
            labelX.push(peak.mz);
            labelY.push(peak.y);
            labelText.push(peak.mz.toFixed(decimals));
          }
        });
        traces.push({
          type: "scatter",
          mode: "text",
          x: labelX,
          y: labelY,
          text: labelText,
          textposition: "top center",
          textfont: { color: $("textColor").value, size: Number($("fontSize").value) - 1 },
          hoverinfo: "skip",
          showlegend: false,
          xaxis: xAxisId,
          yaxis: yAxisId
        });
      }
      return traces;
    }

    function getYScale(index, sharedMax) {
      if ($("lockY").checked) return sharedMax;
      const input = $(`yScale${index + 1}`);
      const value = input ? Number(input.value) : sharedMax;
      return Number.isFinite(value) && value > 0 ? value : sharedMax;
    }

    function getYAxisTicks(max, index, compactStack) {
      const step = max <= 140 ? 20 : Math.ceil(max / 5 / 10) * 10;
      const ticks = [];
      for (let value = 0; value < max; value += step) {
        ticks.push(Number(value.toFixed(6)));
      }
      const previousTick = ticks[ticks.length - 1];
      const showMaxTick = !Number.isFinite(previousTick) || max - previousTick >= step * 0.45;
      if (showMaxTick) ticks.push(max);
      return {
        tickvals: ticks,
        ticktext: ticks.map(value => compactStack && index > 0 && value === max ? "" : String(value))
      };
    }

    function labelKey(xref, yref, mz) {
      return `${xref}|${yref}|${Number(mz).toFixed(6)}`;
    }

    function applyLabelEdit(label) {
      const edit = labelEdits[label.key] || {};
      return {
        ...label,
        x: edit.x ?? label.x,
        y: edit.y ?? label.y,
        ax: edit.ax ?? label.ax,
        ay: edit.ay ?? label.ay,
        hidden: Boolean(edit.hidden)
      };
    }

    function makeAnnotation(label) {
      const hasConnector = Math.abs(Number(label.ax) || 0) >= 8;
      return {
        x: label.x,
        y: label.y,
        xref: label.xref,
        yref: label.yref,
        text: label.text,
        showarrow: true,
        arrowhead: 0,
        arrowside: "none",
        arrowsize: 1,
        arrowwidth: hasConnector ? 1.2 : 0,
        arrowcolor: hasConnector ? $("textColor").value : "rgba(0,0,0,0)",
        ax: label.ax,
        ay: label.ay,
        font: {
          family: $("fontFamily").value,
          size: Number($("fontSize").value) || 14,
          color: $("textColor").value
        },
        bgcolor: $("backgroundColor").value,
        bordercolor: "rgba(0,0,0,0)",
        borderpad: 2
      };
    }

    function getDefaultLabelCandidates(spectra, threshold, decimals) {
      if (!$("clickMz").checked || !$("labelPeaks").checked) return [];
      return spectra.flatMap((spectrum, index) => {
        const xref = getAxisId("x", index);
        const yref = getAxisId("y", index);
        return normalizePeaks(spectrum.peaks)
          .filter(peak => peak.y >= threshold)
          .map(peak => ({
            key: labelKey(xref, yref, peak.mz),
            x: peak.mz,
            y: peak.y,
            xref,
            yref,
            text: peak.mz.toFixed(decimals),
            ax: 0,
            ay: -28
          }));
      });
    }

    function buildManualAnnotations(spectra, threshold, decimals) {
      const labels = [
        ...getDefaultLabelCandidates(spectra, threshold, decimals),
        ...selectedPeaks
      ].map(applyLabelEdit).filter(label => !label.hidden);
      renderedAnnotationKeys = labels.map(label => label.key);
      return labels.map(makeAnnotation);
    }

    function buildLayout(spectra, threshold, decimals) {
      const total = spectra.length;
      const fontSize = Number($("fontSize").value) || 14;
      const yMax = Number($("yScale").value) || 100;
      const gapPercent = Number($("spectrumGap").value);
      const cleanGapPercent = Number.isFinite(gapPercent) ? Math.min(Math.max(gapPercent, 0), 30) : 8;
      const spectrumGap = cleanGapPercent / 100;
      const compactStack = total > 1 && cleanGapPercent <= 2;
      const shareBoxBoundaries = $("closeBox").checked && total > 1 && cleanGapPercent === 0;
      const minMz = $("minMz").value === "" ? undefined : Number($("minMz").value);
      const maxMz = $("maxMz").value === "" ? undefined : Number($("maxMz").value);
      const xTickStep = $("xTickStep").value === "" ? undefined : Number($("xTickStep").value);
      const gridLineWidth = Number($("gridLineWidth").value) || 1;
      const boxLineWidth = Number($("boxLineWidth").value) || 1;
      const axisCommon = {
        gridcolor: $("gridColor").value,
        gridwidth: gridLineWidth,
        showgrid: $("showGrid").checked,
        zeroline: false,
        linecolor: $("textColor").value,
        linewidth: boxLineWidth,
        layer: "above traces",
        showline: $("closeBox").checked,
        mirror: $("closeBox").checked,
        ticks: "outside",
        tickfont: { size: fontSize, color: $("textColor").value }
      };
      const layout = {
        title: { text: $("chartTitle").value, font: { size: fontSize + 10, color: $("textColor").value } },
        paper_bgcolor: $("backgroundColor").value,
        plot_bgcolor: $("backgroundColor").value,
        font: { family: $("fontFamily").value, size: fontSize, color: $("textColor").value },
        margin: { l: 80 + Number($("yOffset").value || 0), r: 30, t: 80, b: 80 },
        showlegend: total > 1,
        legend: { orientation: "h", x: 0, y: -0.16 },
        annotations: buildManualAnnotations(spectra, threshold, decimals)
      };

      if (total > 1) {
        layout.annotations.push({
          text: $("yLabel").value,
          x: -0.12 - (Number($("yOffset").value || 0) / 900),
          y: 0.5,
          xref: "paper",
          yref: "paper",
          showarrow: false,
          textangle: -90,
          xanchor: "center",
          yanchor: "middle",
          font: {
            family: $("fontFamily").value,
            size: fontSize,
            color: $("textColor").value
          }
        });
      }

      for (let i = 0; i < total; i += 1) {
        const xAxisName = i === 0 ? "xaxis" : `xaxis${i + 1}`;
        const axisName = i === 0 ? "yaxis" : `yaxis${i + 1}`;
        const yAxisId = getAxisId("y", i);
        const xAxisId = getAxisId("x", i);
        const isBottomAxis = i === total - 1;
        layout[xAxisName] = {
          ...axisCommon,
          mirror: shareBoxBoundaries ? i === 0 : $("closeBox").checked,
          title: isBottomAxis ? { text: $("xLabel").value, standoff: 18 } : undefined,
          range: Number.isFinite(minMz) && Number.isFinite(maxMz) ? [minMz, maxMz] : undefined,
          tickmode: Number.isFinite(xTickStep) && xTickStep > 0 ? "linear" : undefined,
          dtick: Number.isFinite(xTickStep) && xTickStep > 0 ? xTickStep : undefined,
          tick0: Number.isFinite(minMz) ? minMz : undefined,
          anchor: yAxisId,
          domain: [0, 1],
          showticklabels: isBottomAxis,
          matches: i === 0 ? undefined : "x"
        };
        layout[axisName] = {
          ...axisCommon,
          title: total === 1 && i === 0 ? { text: $("yLabel").value, standoff: 20 } : undefined,
          range: [0, getYScale(i, yMax)],
          ...getYAxisTicks(getYScale(i, yMax), i, compactStack),
          domain: axisDomain(i, total, spectrumGap),
          anchor: xAxisId
        };
      }

      return layout;
    }

    function renderPlot(statusMessage) {
      const spectra = getSpectra();
      const status = $("status");
      if (!spectra.length) {
        Plotly.purge("plot");
        status.textContent = t("empty");
        return;
      }

      const decimals = Number($("decimals").value) || 0;
      const threshold = Number($("threshold").value) || 0;
      const data = spectra.flatMap((spectrum, index) => makePeakTrace(spectrum, index, spectra.length, decimals, threshold));
      const layout = buildLayout(spectra, threshold, decimals);
      const previewWidth = Number($("exportWidth").value) || 1200;
      const previewHeight = Number($("exportHeight").value) || 700;
      const config = {
        responsive: true,
        displaylogo: false,
        editable: $("clickMz").checked,
        edits: {
          annotationPosition: $("clickMz").checked,
          annotationText: false,
          axisTitleText: false,
          colorbarPosition: false,
          legendPosition: false,
          shapePosition: false,
          titleText: false
        },
        modeBarButtonsToRemove: ["lasso2d", "select2d"]
      };

      if ($("previewExport").checked) {
        $("plot").style.width = `${previewWidth}px`;
        $("plot").style.height = `${previewHeight}px`;
        layout.width = previewWidth;
        layout.height = previewHeight;
        layout.autosize = false;
      } else {
        $("plot").style.width = "100%";
        $("plot").style.height = "";
        layout.autosize = true;
      }

      Plotly.react("plot", data, layout, config).then(plotDiv => {
        Plotly.Plots.resize(plotDiv);
        bringPlotBoxToFront();
        if (!clickHandlerBound && typeof plotDiv.on === "function") {
          plotDiv.on("plotly_click", handlePeakClick);
          clickHandlerBound = true;
        }
        if (!relayoutHandlerBound && typeof plotDiv.on === "function") {
          plotDiv.on("plotly_relayout", handleRelayout);
          relayoutHandlerBound = true;
        }
        const peakCount = spectra.reduce((sum, spectrum) => sum + spectrum.peaks.length, 0);
        const skipped = spectra.reduce((sum, spectrum) => sum + spectrum.skipped, 0);
        status.textContent = statusMessage || `${t("generated")(peakCount)} ${skipped ? t("parseError") : ""}`.trim();
      });
      lastPlot = { data, layout, config };
    }

    function getPeakYFromPoint(point, mz) {
      const trace = point.fullData;
      if (!trace || !Array.isArray(trace.x) || !Array.isArray(trace.y)) return Number(point.y);
      const values = trace.x
        .map((xValue, index) => Number(xValue) === mz ? Number(trace.y[index]) : NaN)
        .filter(Number.isFinite);
      return values.length ? Math.max(...values) : Number(point.y);
    }

    function isDefaultLabelPeak(y) {
      const threshold = Number($("threshold").value) || 0;
      return $("labelPeaks").checked && y >= threshold;
    }

    function toggleLabelVisibility(key) {
      const edit = labelEdits[key] || {};
      labelEdits[key] = { ...edit, hidden: !edit.hidden };
    }

    function handlePeakClick(event) {
      if (!$("clickMz").checked || !event.points || !event.points[0]) return;
      const point = event.points[0];
      const mz = Number(point.customdata || point.x);
      if (!Number.isFinite(mz)) return;
      const y = getPeakYFromPoint(point, mz);
      if (!Number.isFinite(y)) return;
      const xref = point.fullData?.xaxis || "x";
      const yref = point.fullData?.yaxis || "y";
      const key = labelKey(xref, yref, mz);
      if (isDefaultLabelPeak(y) || selectedPeaks.some(label => label.key === key)) {
        toggleLabelVisibility(key);
      } else {
        selectedPeaks.push({
          key,
          x: mz,
          y,
          xref,
          yref,
          text: mz.toFixed(Number($("decimals").value) || 1),
          ax: 0,
          ay: -28
        });
      }
      renderPlot(t("selected")(mz.toFixed(Number($("decimals").value) || 1)));
      $("status").textContent = t("selected")(mz.toFixed(Number($("decimals").value) || 1));
    }

    function handleRelayout(update) {
      requestAnimationFrame(bringPlotBoxToFront);
      let annotationMoved = false;
      Object.entries(update || {}).forEach(([key, value]) => {
        const match = key.match(/^annotations\[(\d+)\]\.(ax|ay|x|y)$/);
        if (!match) return;
        const index = Number(match[1]);
        const prop = match[2];
        const keyForAnnotation = renderedAnnotationKeys[index];
        if (!keyForAnnotation) return;
        labelEdits[keyForAnnotation] = {
          ...(labelEdits[keyForAnnotation] || {}),
          [prop]: value
        };
        annotationMoved = true;
      });
      if (annotationMoved) {
        requestAnimationFrame(() => renderPlot());
      }
    }

    function bringPlotBoxToFront() {
      document.querySelectorAll("#plot .xlines-above, #plot .ylines-above").forEach(layer => {
        layer.parentNode?.appendChild(layer);
      });
      hideVerticalAnnotationConnectors();
      drawPlotBoxOverlay();
    }

    function hideVerticalAnnotationConnectors() {
      document.querySelectorAll("#plot .annotation-arrow-g path:first-child").forEach(path => {
        const match = (path.getAttribute("d") || "").match(/^M([0-9.-]+),[0-9.-]+L([0-9.-]+),/);
        if (!match) return;
        const x1 = Number(match[1]);
        const x2 = Number(match[2]);
        path.style.display = Math.abs(x1 - x2) < 1 ? "none" : "";
      });
    }

    function drawPlotBoxOverlay() {
      const svg = document.querySelector("#plot svg.main-svg");
      if (!svg) return;
      svg.querySelector(".plot-box-overlay")?.remove();
      if (!$("closeBox").checked) return;

      const overlay = document.createElementNS("http://www.w3.org/2000/svg", "g");
      overlay.setAttribute("class", "plot-box-overlay");
      const lineData = Array.from(document.querySelectorAll("#plot path.xlines-above.crisp, #plot path.ylines-above.crisp"))
        .map(path => path.getAttribute("d"))
        .filter(Boolean);
      lineData.forEach(d => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", $("textColor").value);
        path.setAttribute("stroke-width", String(Number($("boxLineWidth").value) || 1));
        path.setAttribute("shape-rendering", "crispEdges");
        path.setAttribute("vector-effect", "non-scaling-stroke");
        overlay.appendChild(path);
      });
      svg.appendChild(overlay);
    }

    function setTab(name) {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.tab === name));
      document.querySelectorAll(".panel").forEach(panel => panel.classList.toggle("active", panel.id === `panel-${name}`));
    }

    function syncSpectrumVisibility() {
      $("spectrum2").classList.toggle("hidden", !$("secondSpectrum").checked);
      $("spectrum3").classList.toggle("hidden", !$("secondSpectrum").checked || !$("thirdSpectrum").checked);
      $("spectrum4").classList.toggle("hidden", !$("secondSpectrum").checked || !$("thirdSpectrum").checked || !$("fourthSpectrum").checked);
    }

    function resetDefaults() {
      const defaults = {
        chartTitle: "Mass Spectrum",
        xLabel: "<i>m/z</i>",
        yLabel: "Relative intensity (%)",
        peakColor1: "#1f4e8b",
        peakColor2: "#c94e4e",
        peakColor3: "#2c8f63",
        peakColor4: "#8a5cc2",
        backgroundColor: "#ffffff",
        textColor: "#1c2430",
        gridColor: "#eceff3",
        boxLineWidth: "1",
        gridLineWidth: "1",
        fontFamily: "Arial",
        fontSize: "14",
        yOffset: "20",
        yScale: "120",
        yScale1: "120",
        yScale2: "120",
        yScale3: "120",
        yScale4: "120",
        decimals: "1",
        minMz: "",
        maxMz: "",
        xTickStep: "",
        threshold: "10",
        spectrumGap: "8",
        exportWidth: "1200",
        exportHeight: "700",
        exportScale: "2"
      };
      Object.entries(defaults).forEach(([id, value]) => {
        if ($(id)) $(id).value = value;
      });
      $("showGrid").checked = true;
      $("closeBox").checked = false;
      $("showDots").checked = false;
      $("normalize").checked = true;
      $("lockY").checked = true;
      $("labelPeaks").checked = true;
      $("clickMz").checked = false;
      $("previewExport").checked = false;
      selectedPeaks = [];
      labelEdits = {};
      renderedAnnotationKeys = [];
      renderPlot();
    }

    function downloadPng() {
      if (!lastPlot.data.length) renderPlot();
      Plotly.toImage("plot", {
        format: "png",
        width: Number($("exportWidth").value) || 1200,
        height: Number($("exportHeight").value) || 700,
        scale: Number($("exportScale").value) || 2
      }).then(url => {
        const link = document.createElement("a");
        link.href = url;
        link.download = "mass-spectrum.png";
        link.click();
      });
    }

    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => setTab(tab.dataset.tab)));
    $("ptBtn").addEventListener("click", () => updateLanguage("pt"));
    $("enBtn").addEventListener("click", () => updateLanguage("en"));
    $("secondSpectrum").addEventListener("change", () => {
      syncSpectrumVisibility();
      renderPlot();
    });
    $("thirdSpectrum").addEventListener("change", () => {
      syncSpectrumVisibility();
      renderPlot();
    });
    $("fourthSpectrum").addEventListener("change", () => {
      syncSpectrumVisibility();
      renderPlot();
    });
    $("loadExample").addEventListener("click", () => {
      $("data1").value = exampleData;
      renderPlot();
    });
    $("clearData").addEventListener("click", () => {
      $("data1").value = "";
      $("data2").value = "";
      $("data3").value = "";
      $("data4").value = "";
      renderPlot();
    });
    $("chooseFile").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      file.text().then(text => {
        const target = $("secondSpectrum").checked
          ? ($("thirdSpectrum").checked ? ($("fourthSpectrum").checked ? $("data4") : $("data3")) : $("data2"))
          : $("data1");
        target.value = text;
        $("status").textContent = t("fileLoaded");
      });
    });
    $("generate").addEventListener("click", () => renderPlot());
    $("download").addEventListener("click", downloadPng);
    $("resetDefaults").addEventListener("click", resetDefaults);
    $("clearSelection").addEventListener("click", () => {
      selectedPeaks = [];
      labelEdits = {};
      renderedAnnotationKeys = [];
      renderPlot(t("selectionCleared"));
    });

    document.querySelectorAll("input, textarea, select").forEach(input => {
      input.addEventListener("input", () => {
        if (input.type !== "file") renderPlot();
      });
    });

    $("data1").placeholder = "One pair per line. Accepted separators: comma, semicolon, tab or space.\n\nExample:\n50.1, 12\n77.0, 45\n91.1, 100\n105.0, 38\n120.2, 8";
    $("data1").value = exampleData;
    $("data2").value = `229.171734 2.1
243.188475 18.8
256.227004 42.5
323.233414 72.9
341.297180 38.1
377.124113 100
405.025543 11.7`;
